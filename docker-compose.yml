services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lagoon-postgres
    environment:
      POSTGRES_USER: lagoon
      POSTGRES_PASSWORD: lagoon
      POSTGRES_DB: lagoon
    ports:
      # Bind to loopback only. With lagoon/lagoon credentials, exposing this
      # on 0.0.0.0 would put the synced mailbox on the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - lagoon-pgdata:/var/lib/postgresql/data

volumes:
  lagoon-pgdata: