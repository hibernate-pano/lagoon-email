services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lagoon-postgres
    environment:
      POSTGRES_USER: lagoon
      POSTGRES_PASSWORD: lagoon
      POSTGRES_DB: lagoon
    ports:
      # Host 5433 -> container 5432. A local Homebrew postgres owns 127.0.0.1:5432,
      # so Lagoon's Docker instance must not collide with it.
      - "5433:5432"
    volumes:
      - lagoon-pgdata:/var/lib/postgresql/data

volumes:
  lagoon-pgdata: