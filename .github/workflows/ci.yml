name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
      - name: Format check
        run: |
          cargo fmt --manifest-path crates/Cargo.toml --check
          cargo fmt --manifest-path shell/Cargo.toml --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --offline --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Clippy shell (warnings are errors)
        run: cargo clippy --offline --manifest-path shell/Cargo.toml --all-targets -- -D warnings
      - name: Backend tests (crates workspace)
        run: cargo test --offline --manifest-path crates/Cargo.toml
      - name: Shell build + selftest
        run: |
          cargo build --manifest-path shell/Cargo.toml
          cargo run --manifest-path shell/Cargo.toml -- --selftest

  frontend:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: cd web && npm install
      - name: Test web
        run: cd web && npm test
      - name: Build web
        run: cd web && npm run build
