[package]
name = "probe"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.11.1"
async-imap = "0.12.0"
axum = "0.8.9"
base64 = "0.23.1"
encoding_rs = "0.8.42"
imap = "2.4.1"
keyring = "4.2.0"
lettre = "0.11.23"
mail-parser = "1.0.0"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
security-framework = "3.7.0"
tokio = { version = "1.54.1", features = ["full"] }
# populated by `cargo add` so versions are the real registry latest
