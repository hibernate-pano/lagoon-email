name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # No database service: the test harness opens a hermetic temp-file
      # SQLite store per test (Tests/LagoonServerTests/TestDatabase.swift),
      # so `scripts/run-all-tests.sh` is the whole verification story.
      - name: Run full checks
        run: bash scripts/run-all-tests.sh
