# Hand-written minimal Tauri 2 app: no npm, no bundler, no tauri-cli.
# Static frontend lives in ./ui, embedded at compile time by tauri::generate_context!.
[package]
name = "tauri-probe"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
